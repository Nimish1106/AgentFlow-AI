# nginx config for the AgentFlow operations dashboard.
#
# Two jobs:
#   1. Serve the built SPA, falling back to index.html so client-side routing
#      survives a page refresh.
#   2. Reverse-proxy the API paths to the backend container, so the browser
#      sees one origin. This is why the dashboard needs no absolute API URL
#      baked in at build time.
#
# The upstream is resolved per request through Docker's embedded DNS: naming the
# backend in a variable stops nginx refusing to start when the backend is not up
# yet (a hardcoded proxy_pass host fails resolution at boot).

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    resolver 127.0.0.11 valid=10s ipv6=off;

    # Long-lived immutable assets: Vite fingerprints every filename.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # The API surface the dashboard consumes. `set` + variable forces runtime
    # DNS resolution rather than start-up resolution.
    location ~ ^/(tickets|workflows|approvals|metrics|health) {
        set $api_upstream http://backend:8000;
        proxy_pass $api_upstream$request_uri;

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # A workflow read is fast; keep timeouts tight so a wedged backend
        # surfaces as an error in the UI instead of a hanging spinner.
        proxy_connect_timeout 5s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
    }

    # SPA fallback.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # index.html must never be cached, or a deploy leaves clients on stale JS.
    location = /index.html {
        add_header Cache-Control "no-store, must-revalidate";
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Baseline hardening. No CSP here: the dashboard is served behind whatever
    # ingress the deployment provides, and a wrong CSP silently breaks it.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
}
